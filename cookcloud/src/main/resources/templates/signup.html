<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
     <link rel="stylesheet" th:href="@{/css/signup.css}">
     <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
     <script src="/js/allergy.js" defer></script>
     <script src="/js/signup.js" defer></script>
</head>
<body>
	<div class="container">
    <h2>회원가입</h2>
    <form th:action="@{/signup}" method="post" th:object="${member}">
        아이디<input type="text" th:field="*{memId}" id="memId" class="input-field" name="memId" required><br>
        <div id="idError"></div>
        
        비밀번호<input type="password" th:field="*{memPassword}" id="memPassword" class="input-field" name="memPassword" required><br><br>
        <p th:if="${#fields.hasErrors('memPassword')}" th:errors="*{memPassword}"></p>
        
        이름<input type="text" th:field="*{memName}" id="memName" class="input-field" name="memName" required><br><br>
        <p th:if="${#fields.hasErrors('memName')}" th:errors="*{memName}"></p>
        
        닉네임<input type="text" th:field="*{memNickname}" id="memNickname" class="input-field" name="memNickname" required><br>
        <div id="idError"></div>
        
        <div class="dropdown">
			<label for="allergy">알러지&비선호음식 체크</label>
            <div id="selected-allergies" class="selected-allergies"></div>
	        <div class="dropdown-content">
                 <span th:each="allergy : ${allergyList}" class="allergy-item" th:data-id="${allergy.allergyId}">
                       <span th:text="${allergy.allergyName}">#알러지 이름</span>
                 </span>
            </div>            
        </div><br><br>
        
        이메일<input type="email" th:field="*{memEmail}" id="memEmail" class="input-field" name="memEmail" required><br><br>
        
        전화번호<input type="text" th:field="*{memPhone}" id="memPhone" class="input-field" name="memPhone" required><br><br>
        
        <button type="submit" class="submit-btn">가입하기</button>
    </form><br>
    
    <!-- 오류 메시지 -->
    <p th:if="${error}" th:text="${error}" style="color: red;"></p>

    <a th:href="@{/login}">로그인 하기</a>
    </div>
</body>
</html>
